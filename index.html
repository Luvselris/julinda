<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">julinda ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --pink-pastel: #ffd6e5;
      --pink-deep: #eb7aa3;
      --blue-pastel: #d9f0ff;
      --purple-pastel: #eadcff;
      --cream-soft: #fffdf8;
      --card-bg: rgba(255, 255, 255, 0.94);
      --border-pastel: rgba(235, 122, 163, 0.25);
      --text-main: #4a3f55;
      --text-muted: #7d6f8a;
      --shadow-pastel: 0 12px 28px rgba(166, 132, 196, 0.14);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      color: var(--text-main);
      background-color: var(--cream-soft);
      background-image:
        radial-gradient(rgba(247, 178, 204, 0.36) 1.5px, transparent 1.5px),
        radial-gradient(rgba(167, 152, 219, 0.22) 1.4px, transparent 1.4px),
        linear-gradient(145deg, #fff6f9 0%, #f1f8ff 52%, #f7f2ff 100%);
      background-size: 36px 36px, 54px 54px, 100% 100%;
      background-position: 0 0, 18px 27px, 0 0;
      overflow-x: hidden;
      position: relative;
    }

    /* ลูกเล่นฟุ้งๆ กลมๆ ชมพู-ฟ้า-ม่วงพาสเทลลอยไปมา */
    .pastel-ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(26px);
      opacity: 0.55;
      animation: orbDrift 13s ease-in-out infinite alternate;
    }

    .rising-dot {
      position: absolute;
      bottom: -40px;
      border-radius: 50%;
      filter: blur(1.5px);
      opacity: 0;
      animation: dotFloatUp 12s linear infinite;
    }

    @keyframes orbDrift {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(16px, -18px) scale(1.06); }
      100% { transform: translate(-14px, 14px) scale(0.96); }
    }

    @keyframes dotFloatUp {
      0% { transform: translateY(0) scale(0.85); opacity: 0; }
      18% { opacity: 0.6; }
      85% { opacity: 0.48; }
      100% { transform: translateY(-115vh) scale(1.12); opacity: 0; }
    }

    /* หน้าแรกต้อนรับ */
    .welcome-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      z-index: 2;
    }

    .welcome-screen.hidden {
      display: none;
    }

    .welcome-card {
      width: 100%;
      max-width: 356px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 2px solid #ffffff;
      border-radius: 32px;
      padding: 32px 22px 26px;
      text-align: center;
      box-shadow: var(--shadow-pastel);
      animation: cardFadeIn 0.4s ease;
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .welcome-clean-img {
      width: 112px;
      height: 112px;
      object-fit: contain;
      margin: 0 auto 14px;
      display: block;
      animation: kittyGentleFloat 3s ease-in-out infinite;
    }

    @keyframes kittyGentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .welcome-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.3px;
      margin-bottom: 10px;
    }

    .welcome-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.85;
      white-space: pre-line;
      margin-bottom: 22px;
    }

    .pink-action-btn {
      width: 100%;
      padding: 13px 18px;
      border-radius: 24px;
      border: 2px solid #ffffff;
      background: linear-gradient(135deg, #ffa2c4, var(--pink-deep));
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(235, 122, 163, 0.3);
      transition: transform 0.16s ease;
    }

    .pink-action-btn:active {
      transform: scale(0.97);
    }

    /* หน้าโปรไฟล์และคอนแทคหลัก */
    .main-screen {
      display: none;
      width: 100%;
      max-width: 405px;
      margin: 0 auto;
      padding: 18px 14px 76px;
      position: relative;
      z-index: 2;
    }

    .main-screen.active {
      display: block;
      animation: cardFadeIn 0.4s ease;
    }

    .top-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }

    .back-pill-btn, .music-pill-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border-pastel);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(166, 132, 196, 0.1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease;
    }

    .back-pill-btn:active, .music-pill-btn:active {
      transform: scale(0.96);
    }

    .music-pill-btn.playing {
      border-color: var(--pink-deep);
      color: var(--pink-deep);
      background: #fff6fa;
    }

    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 2px solid #ffffff;
      border-radius: 30px;
      padding: 12px 14px 22px;
      text-align: center;
      box-shadow: var(--shadow-pastel);
      margin-bottom: 16px;
    }

    .banner-frame {
      width: 100%;
      height: 152px;
      border-radius: 22px;
      overflow: hidden;
      border: 2px solid #ffffff;
      background: linear-gradient(135deg, var(--pink-pastel), var(--blue-pastel), var(--purple-pastel));
    }

    .banner-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* คงขนาดพอดีเดิม และขยับจุดวงม่วงด้านบนไม่ให้โผล่พ้นขอบกรอบ */
    .avatar-stage {
      position: relative;
      width: 280px;
      height: 220px;
      margin: -80px auto -20px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }

    .avatar-photo-circle {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      overflow: hidden;
      border: none;
      background: transparent;
      box-shadow: none;
      position: relative;
      z-index: 1;
    }

    .avatar-photo-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translateY(5px);
      display: block;
    }

    .avatar-frame-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: translateY(8px);
      pointer-events: none;
      z-index: 2;
    }

    .shop-name-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 2px;
    }

    .shop-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.3px;
    }

    .floating-name-png {
      width: 28px;
      height: 28px;
      object-fit: contain;
      animation: namePngFloat 2.8s ease-in-out infinite;
    }

    @keyframes namePngFloat {
      0%, 100% { transform: translateY(0px) rotate(-4deg); }
      50% { transform: translateY(-4px) rotate(5deg); }
    }

    .bio-panel {
      margin-top: 10px;
      padding: 6px 10px 0;
      font-size: 13.5px;
      line-height: 1.9;
      color: var(--text-muted);
      white-space: pre-line;
      text-align: center;
    }

    .links-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pastel-link-box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 2px solid #ffffff;
      border-radius: 22px;
      padding: 15px 18px;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
      box-shadow: var(--shadow-pastel);
      transition: transform 0.16s ease;
    }

    .pastel-link-box:nth-child(1) {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(255, 236, 243, 0.92));
    }

    .pastel-link-box:nth-child(2) {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(236, 248, 255, 0.92));
    }

    .pastel-link-box:nth-child(3) {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(246, 239, 255, 0.92));
    }

    .pastel-link-box:active {
      transform: scale(0.98);
    }

    .link-arrow {
      color: var(--pink-deep);
      font-size: 16px;
    }
  </style>
</head>
<body>

  <audio id="bgMusic" loop preload="auto" playsinline src="https://file.garden/asG8Gt-rqWIpi3II/Butter%20Love%20Fan%20Chant.mp3"></audio>

  <!-- ลูกเล่นฟุ้งๆ กลมๆ ชมพู-ฟ้า-ม่วงพาสเทลลอยไปมา -->
  <div class="pastel-ambient" id="pastelAmbient">
    <div class="ambient-orb" style="width:220px; height:220px; top:6%; left:-50px; background:#ffd6e5;"></div>
    <div class="ambient-orb" style="width:240px; height:240px; top:38%; right:-60px; background:#d9f0ff; animation-delay:-4s;"></div>
    <div class="ambient-orb" style="width:200px; height:200px; bottom:8%; left:8%; background:#eadcff; animation-delay:-8s;"></div>
  </div>

  <!-- หน้าแรกต้อนรับ -->
  <section class="welcome-screen" id="welcomeScreen">
    <div class="welcome-card">
      <img id="welcomeImg" src="https://files.catbox.moe/m3d276.png" alt="julinda" class="welcome-clean-img">
      <h1 class="welcome-name" id="welcomeNameText">julinda</h1>
      <div class="welcome-desc" id="welcomeDescText">welcome to julinda
click to watch ‎૮꒰ ˶• ༝ •˶꒱ა</div>
      <button type="button" class="pink-action-btn" id="goToContactBtn" onclick="enterContactPage()">go to contact  ♡</button>
    </div>
  </section>

  <!-- หน้าโปรไฟล์และคอนแทค -->
  <main class="main-screen" id="mainScreen">
    <div class="top-header-row">
      <button type="button" class="back-pill-btn" onclick="backToWelcome()">← หน้าแรก</button>
      <button type="button" class="music-pill-btn" id="musicPillBtn" onclick="toggleMusicBtn(event)">♫ เพลง</button>
    </div>

    <div class="profile-card">
      <div class="banner-frame">
        <img id="bannerImg" src="https://files.catbox.moe/uic9km.jpeg" alt="Banner">
      </div>

      <div class="avatar-stage">
        <div class="avatar-photo-circle">
          <img id="profileImg" src="https://files.catbox.moe/76x8fa.png" alt="Profile">
        </div>
        <img id="profileFrameImg" class="avatar-frame-overlay" src="https://files.catbox.moe/t705p0.png" alt="Frame">
      </div>

      <div class="shop-name-row">
        <span class="shop-title" id="shopTitleText">julinda</span>
        <img id="nameSideImg" class="floating-name-png" src="https://files.catbox.moe/gp9ff1.png" alt="Icon">
      </div>

      <div class="bio-panel" id="bioPanelText">welcome to julinda  ‎˃ ⤙ ˂
open 9:00 - 23:30 ♡
ปกติจะตอบกลับทันที ถ้าว่างนะคับ •᎑•</div>
    </div>

    <div class="links-stack">
      <a id="link1" href="https://lin.ee/6AUvK58" target="_blank" rel="noopener noreferrer" class="pastel-link-box">
        <span id="link1Title">♡ line me : @180igtyi</span>
        <span class="link-arrow">➔</span>
      </a>

      <a id="link2" href="https://www.facebook.com/share/1AEnqrLjs8/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="pastel-link-box">
        <span id="link2Title">♡ facebook  me</span>
        <span class="link-arrow">➔</span>
      </a>

      <a id="link3" href="https://julindamerly.ksmbxll.com/" target="_blank" rel="noopener noreferrer" class="pastel-link-box">
        <span id="link3Title">♡ check credit ໒꒱</span>
        <span class="link-arrow">➔</span>
      </a>
    </div>
  </main>

  <script>
    const DB_COLLECTION = "julinda_config";
    const DEFAULT_MUSIC = "https://file.garden/asG8Gt-rqWIpi3II/Butter%20Love%20Fan%20Chant.mp3";

    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const audio = document.getElementById("bgMusic");
    const musicPillBtn = document.getElementById("musicPillBtn");
    let manuallyPaused = false;

    function syncMusicLabel() {
      if (!audio.paused) {
        musicPillBtn.classList.add("playing");
        musicPillBtn.textContent = "♪ กำลังเล่น";
      } else {
        musicPillBtn.classList.remove("playing");
        musicPillBtn.textContent = "♫ เพลง";
      }
    }

    audio.addEventListener("play", syncMusicLabel);
    audio.addEventListener("pause", syncMusicLabel);

    function startMusicImmediate() {
      if (manuallyPaused) return;
      if (!audio.getAttribute("src")) {
        audio.setAttribute("src", DEFAULT_MUSIC);
      }
      audio.play().catch(() => {});
    }

    function enterContactPage() {
      document.getElementById("welcomeScreen").classList.add("hidden");
      document.getElementById("mainScreen").classList.add("active");
      manuallyPaused = false;
      startMusicImmediate();
    }

    function backToWelcome() {
      document.getElementById("mainScreen").classList.remove("active");
      document.getElementById("welcomeScreen").classList.remove("hidden");
    }

    function toggleMusicBtn(e) {
      if (e) e.stopPropagation();
      if (!audio.getAttribute("src")) {
        audio.setAttribute("src", DEFAULT_MUSIC);
      }
      if (audio.paused) {
        manuallyPaused = false;
        audio.play().catch(() => {});
      } else {
        manuallyPaused = true;
        audio.pause();
      }
    }

    window.addEventListener("pointerdown", () => {
      if (!manuallyPaused && audio.paused) {
        startMusicImmediate();
      }
    }, { passive: true });

    function applyConfig(d) {
      if (!d) return;
      if (d.welcomeImg) document.getElementById("welcomeImg").src = d.welcomeImg;
      if (d.welcomeName) document.getElementById("welcomeNameText").textContent = d.welcomeName;
      if (d.welcomeDesc) document.getElementById("welcomeDescText").textContent = d.welcomeDesc;
      if (d.goToContactLabel) document.getElementById("goToContactBtn").textContent = d.goToContactLabel;

      if (d.bannerImg) document.getElementById("bannerImg").src = d.bannerImg;
      if (d.profileImg) document.getElementById("profileImg").src = d.profileImg;
      if (d.profileFrameImg) document.getElementById("profileFrameImg").src = d.profileFrameImg;
      if (d.nameSideImg) document.getElementById("nameSideImg").src = d.nameSideImg;

      if (d.shopName) {
        document.getElementById("shopTitleText").textContent = d.shopName;
        document.getElementById("pageTitle").textContent = d.shopName + " ♡";
      }
      if (d.bioText) document.getElementById("bioPanelText").textContent = d.bioText;

      if (d.link1Title) document.getElementById("link1Title").textContent = d.link1Title;
      if (d.link1Url) document.getElementById("link1").href = d.link1Url;

      if (d.link2Title) document.getElementById("link2Title").textContent = d.link2Title;
      if (d.link2Url) document.getElementById("link2").href = d.link2Url;

      if (d.link3Title) document.getElementById("link3Title").textContent = d.link3Title;
      if (d.link3Url) document.getElementById("link3").href = d.link3Url;

      if (d.musicUrl && audio.getAttribute("src") !== d.musicUrl) {
        const shouldPlay = !manuallyPaused && !audio.paused;
        audio.setAttribute("src", d.musicUrl);
        audio.load();
        if (shouldPlay) audio.play().catch(() => {});
      }
    }

    db.collection(DB_COLLECTION).doc("main").onSnapshot(doc => {
      if (doc.exists) applyConfig(doc.data());
    });

    // ลูกเล่นกลมๆ ฟุ้งๆ ชมพู-ฟ้า-ม่วงพาสเทลลอยขึ้นช้าๆ
    const dotPalette = ["#ffd6e5", "#d9f0ff", "#eadcff", "#fff0f6"];
    const ambientLayer = document.getElementById("pastelAmbient");
    setInterval(() => {
      const dot = document.createElement("div");
      dot.className = "rising-dot";
      const sz = 12 + Math.random() * 16;
      dot.style.width = sz + "px";
      dot.style.height = sz + "px";
      dot.style.background = dotPalette[Math.floor(Math.random() * dotPalette.length)];
      dot.style.left = (6 + Math.random() * 88) + "vw";
      dot.style.animationDuration = (10 + Math.random() * 5) + "s";
      ambientLayer.appendChild(dot);
      setTimeout(() => dot.remove(), 15500);
    }, 1500);
  </script>
</body>
</html>
